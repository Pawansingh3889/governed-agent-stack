repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files

  # Dogfooding: this repo uses the sibling tools from the same stack.
  - repo: https://github.com/Pawansingh3889/pr-sop
    rev: v0.1.2
    hooks:
      - id: pr-sop
