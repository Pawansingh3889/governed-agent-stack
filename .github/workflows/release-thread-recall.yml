name: release thread-recall

# Publish by tagging:
#   git tag thread-recall-v<version> && git push origin thread-recall-v<version>
# The version in the tag must match packages/thread-recall/pyproject.toml; _publish.yml
# refuses the release if it does not.
#
# PyPI trusted publisher for thread-recall (pypi.org -> the project -> Publishing):
#   Owner: Pawansingh3889        Repository: governed-agent-stack
#   Workflow: release-thread-recall.yml
#   Environment: pypi
# Those fields must match this file exactly. They still name the old standalone
# repository, so publishing fails with `invalid-publisher` until each one is
# re-pointed by hand — the same failure the sql-guard -> sql-sop rename caused.

on:
  push:
    tags:
      - 'thread-recall-v*'

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/_publish.yml
    with:
      package: thread-recall
    permissions:
      contents: write   # attach artifacts to the GitHub Release
      id-token: write   # PyPI trusted publishing and MCP Registry OIDC
