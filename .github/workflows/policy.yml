name: policy

# Enforces the stack's own governance rules (policies/) against stack.yaml on every PR,
# checks that control-tower's registry still describes this tree, and validates every
# server.json against the published MCP schema. All three are the same class of check:
# a claim this repo makes about itself, verified rather than trusted. stack.yaml says
# what the components are; tools.yaml says where they are and what they produce;
# server.json is what the MCP Registry is handed at release. A registry full of paths
# that no longer resolve fails silently at runtime as a wall of dead dots, and a bad
# server.json fails after the PyPI upload has already gone out, so both are caught here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install conftest
        run: |
          ver=$(curl -fsSL https://api.github.com/repos/open-policy-agent/conftest/releases/latest \
            | grep -oP '"tag_name": "v\K[^"]+')
          echo "conftest version: $ver"
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${ver}/conftest_${ver}_Linux_x86_64.tar.gz" \
            | tar -xz conftest
          sudo mv conftest /usr/local/bin/

      - name: Run governance policies
        run: conftest test stack.yaml --policy policies/

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --with pyyaml rather than a project dependency: the validator reads the
      # registry, it is not part of the stack the workspace resolves.
      - name: Validate control-tower's registry
        run: uv run --with pyyaml python scripts/check_tools_registry.py

  server-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate every server.json against the MCP schema
        run: uv run --with jsonschema python scripts/check_server_json.py
