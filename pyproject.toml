[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drift-gate"
version = "0.1.0"
description = "Refuse to run against a schema you have not verified. Deterministic schema-drift gate for governed data tooling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pawan Singh Kapkoti" }]
keywords = ["schema", "drift", "governance", "data-contract", "audit", "sql-server"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Capture a live catalog. Not needed to compare two existing catalogs.
scout = ["schema-scout>=0.1"]
# Tamper-evident ledger. If DRIFT_GATE_AUDIT_DB is set without this, we refuse to run.
audit = ["agent-blackbox>=0.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
drift-gate = "drift_gate.cli:main"

[project.urls]
Homepage = "https://github.com/Pawansingh3889/drift-gate"
Stack = "https://github.com/Pawansingh3889/governed-agent-stack"
Changelog = "https://github.com/Pawansingh3889/drift-gate/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/drift_gate"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
per-file-ignores = { "src/drift_gate/cli.py" = ["B008"] }
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
