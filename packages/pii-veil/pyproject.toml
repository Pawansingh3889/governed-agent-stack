[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pii-veil"
version = "0.1.0"
description = "Mask PII in SQL query results before they reach the LLM or the screen. Presidio-backed, on-prem, with a zero-dependency regex fallback."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Pawan Singh Kapkoti" }]
keywords = ["pii", "masking", "redaction", "presidio", "privacy", "governance", "agent", "sql", "on-prem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
dev = ["pytest>=8.0"]

[project.scripts]
pii-veil = "pii_veil.cli:main"

[project.urls]
Homepage = "https://github.com/Pawansingh3889/pii-veil"
Repository = "https://github.com/Pawansingh3889/pii-veil"
"Governed Agent Stack" = "https://github.com/Pawansingh3889/governed-agent-stack"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_veil"]

[tool.hatch.build.targets.sdist]
include = ["src/pii_veil", "README.md", "LICENSE", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
