[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elenchus-mcp"
version = "0.1.0"
description = "Model Context Protocol server that exposes Elenchus survey tools to LLMs (Claude, Cursor, ChatGPT, Continue)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Pawan Singh Kapkoti" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "survey",
    "llm",
    "claude",
    "cursor",
    "chatgpt",
    "elenchus",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "fastmcp>=3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
elenchus-mcp = "elenchus_mcp.server:main"

[project.urls]
Homepage = "https://github.com/govern-agents/elenchus"
Repository = "https://github.com/govern-agents/elenchus"
Issues = "https://github.com/govern-agents/elenchus/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/elenchus_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/elenchus_mcp", "README.md", "LICENSE", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
