# Paste the `components:` block below into governed-agent-stack/stack.yaml.
#
# The stack enforces its component rules as policy-as-code in policies/stack.rego.
# A new component has to pass the same check it asks of everything else, so this
# entry is part of shipping drift-gate, not paperwork afterwards.
#
# The shape below is the one stack.rego actually reads: on_prem and role are
# top-level keys, not nested. Every other field is prose for humans and belongs
# in the README, not here — stack.yaml is machine-readable data.
#
# PREREQUISITE: this entry does not pass policy on its own.
#
#   stack.rego denies any component whose `role` is not in `allowed_roles`, and
#   none of the eight existing roles describes a drift gate. `schema-discovery`
#   is schema-scout's (what is in there); `audit` is agent-blackbox's (what
#   happened). drift-gate answers a third question — is it still what you
#   checked — so it needs its own concern:
#
#     # policies/stack.rego
#      allowed_roles := {
#      	"schema-discovery",
#     +	"schema-drift-detection",
#      	"read-only-access",
#      	...
#      }
#
#   Add that role first, or `conftest test stack.yaml --policy policies/` fails
#   with: component "drift-gate" has role "schema-drift-detection", which is not
#   a recognised governance concern.

components:
  - name: drift-gate
    repo: https://github.com/Pawansingh3889/drift-gate
    license: MIT
    on_prem: true
    role: schema-drift-detection
